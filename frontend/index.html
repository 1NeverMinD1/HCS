    <script>
      (function () {
        if (!/^\/((ru|kk|en)\/?)?$/.test(location.pathname)) return;
        if (document.getElementById("hero-data")) return;
        var base = "https://api.zhkh24.kz/api/";
        var common =
          "filters[isFeatured][$eq]=true&fields[0]=title_ru&fields[1]=title_kk&fields[2]=title_en&fields[3]=desc_ru&fields[4]=desc_kk&fields[5]=desc_en&fields[6]=slug&fields[7]=publishDate&fields[8]=createdAt&sort=publishDate:desc&pagination[pageSize]=1";
        var cats =
          "populate[categories][fields][0]=name_ru&populate[categories][fields][1]=name_kk&populate[categories][fields][2]=name_en";
        var urls = [
          base +
            "news?" +
            common +
            "&populate[desc_img][fields][0]=url&populate[desc_img][fields][1]=formats&populate[desc_img][fields][2]=width&populate[header_cats][fields][0]=name_ru&populate[header_cats][fields][1]=name_kk&populate[header_cats][fields][2]=name_en",
          base +
            "blogs?" +
            common +
            "&populate[back_img][fields][0]=url&populate[back_img][fields][1]=formats&populate[back_img][fields][2]=width&" +
            cats,
          base +
            "articles?" +
            common +
            "&populate[desc_img][fields][0]=url&populate[desc_img][fields][1]=formats&populate[desc_img][fields][2]=width&" +
            cats,
        ];
        window.__heroPromise = Promise.all(
          urls.map(function (u) {
            return fetch(u).then(function (r) {
              return r.json();
            });
          }),
        ).catch(function () {
          return null;
        });
      })();
    </script>
